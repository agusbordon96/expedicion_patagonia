<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNAHUR TIC - DINO-EXCAVACIÓN PATAGONIA</title>
    <!-- Biblioteca principal de p5.js -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>

    <!-- Biblioteca de sonido -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/addons/p5.sound.min.js"></script>

    <!-- Primero los sprites y fondos -->
    <script src="sprite.js"></script>

    <!-- Después el código principal -->
    <script src="game.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --bg-color: #1a1410;
        --text-color: #ffcc66;
        --border-color: #d4a373;
        --panel-bg: rgba(40, 30, 20, 0.9);
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: "Courier New", Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
      }
      .terminal-box {
        border: 2px solid var(--border-color);
        padding: 1rem 1.5rem;
        max-width: 650px;
        width: 92%;
        background: var(--panel-bg);
        text-align: center;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(212, 163, 115, 0.3);
      }
      .header-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed var(--border-color);
        padding-bottom: 0.5rem;
        margin-bottom: 0.8rem;
      }
      h1 { font-size: 1rem; margin: 0; color: #faedcd; text-transform: uppercase; }
      .prompt-counter {
        font-size: 0.75rem;
        color: #e9c46a;
        background: rgba(233, 196, 106, 0.15);
        padding: 3px 6px;
        border: 1px solid #e9c46a;
        border-radius: 4px;
      }
      #game-container { display: flex; justify-content: center; margin-top: 0.5rem; }
      canvas { border-radius: 6px; box-shadow: 0 0 10px rgba(0,0,0,0.8); }
    </style>
  </head>
  <body>
    <div class="terminal-box">
      <div class="header-bar">
        <h1>🦕 DINO-EXCAVACIÓN: PATAGONIA 🦴</h1>
        <div class="prompt-counter">🤖 Prompts IA: <span id="prompt-count">3</span></div>
      </div>
      <div id="game-container"></div>
    </div>

    <!-- Archivos separados de código -->
    <script src="sprites.js"></script>
    <script src="game.js"></script>
  </body>
</html>
